[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# ─────────────────────────────────────────────────────────────────────────────
# Redirects are matched in order, so every specific rule has to sit above the
# SPA catch-all at the bottom — otherwise the catch-all swallows it.
# ─────────────────────────────────────────────────────────────────────────────

# The previous static site's posts. These URLs are already live and may be
# indexed or linked from applications, so they move rather than 404.
[[redirects]]
  from = "/blog-api-ui.html"
  to = "/writing/real-time-ai-nestjs-react-sse"
  status = 301
  force = true

[[redirects]]
  from = "/blog-kiddoai.html"
  to = "/writing/kiddoai-rag-learning-companion"
  status = 301
  force = true

[[redirects]]
  from = "/blog-sufess-hackathon.html"
  to = "/writing/sufess-hackathon-24h"
  status = 301
  force = true

# The old role-specific CVs are no longer maintained separately; they all point
# at the current English master.
[[redirects]]
  from = "/cv/Achref_Lajmi_Backend.pdf"
  to = "/cv/Achref_Lajmi_CV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/cv/Achref_Lajmi_FullStack.pdf"
  to = "/cv/Achref_Lajmi_CV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/cv/Achref_Lajmi_GenAI.pdf"
  to = "/cv/Achref_Lajmi_CV.pdf"
  status = 301
  force = true

# Two CVs used to sit at the site root, with a space in the filename.
[[redirects]]
  from = "/Achref_Lajmi_CV_Backend_Software_Engineer .pdf"
  to = "/cv/Achref_Lajmi_CV.pdf"
  status = 301
  force = true

[[redirects]]
  from = "/Achref_Lajmi_CV_Applied_GenAI_LLM_RAG_Feb2026 .pdf"
  to = "/cv/Achref_Lajmi_CV.pdf"
  status = 301
  force = true

# Client-side routing: every unmatched path renders the app, which decides
# between a page and its own 404.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ─────────────────────────────────────────────────────────────────────────────
# Headers
# ─────────────────────────────────────────────────────────────────────────────

# Vite fingerprints these filenames, so they can be cached permanently.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images are not fingerprinted either, and the article covers get replaced.
# An hour of caching, then revalidate, keeps a swap visible the same day.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cover animations are replaced in place, keeping their filenames, so a long
# max-age strands viewers on an old copy until it expires — must-revalidate
# does not help, since it only forbids serving stale content after expiry.
# Revalidate every time: an unchanged file costs a 304, not a re-download.
[[headers]]
  for = "/video/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# The CV changes without the filename changing, so it must always revalidate.
[[headers]]
  for = "/cv/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
